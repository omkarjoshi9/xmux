name: Control plane
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xmux
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: xmux
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xmux -d xmux"
          --health-interval 2s --health-timeout 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://xmux:ci-test-only@127.0.0.1:5432/xmux
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: infrastructure/control-plane/requirements.lock
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r infrastructure/control-plane/requirements.lock
      - run: make migrate lint test build

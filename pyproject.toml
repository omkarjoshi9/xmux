[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xmux-mux"
version = "0.1.0"
description = "Provider-neutral task and adapter contracts for XMUX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "referencing>=0.30,<1"]

[project.scripts]
xmux-multiplexer = "xmux_multiplexer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
